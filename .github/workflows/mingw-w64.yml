name: MinGW-w64

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mingw-w64-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: ${{ matrix.msystem }}
    runs-on: windows-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - msystem: UCRT64
            package_arch: ucrt-x86_64
            artifact: windows-x86_64-ucrt
          - msystem: MINGW64
            package_arch: x86_64
            artifact: windows-x86_64-msvcrt
          - msystem: MINGW32
            package_arch: i686
            artifact: windows-i686-msvcrt

    defaults:
      run:
        shell: msys2 {0}

    steps:
      # Keep the Bash runners and golden output files LF-only on Windows.
      - name: Configure Git line endings
        shell: bash
        run: git config --global core.autocrlf input

      - uses: actions/checkout@v7

      - name: Set up MinGW-w64
        uses: msys2/setup-msys2@v2
        with:
          msystem: ${{ matrix.msystem }}
          update: true
          path-type: strict
          install: >-
            make
            mingw-w64-${{ matrix.package_arch }}-gcc

      - name: Show toolchain versions
        run: |
          gcc --version
          ar --version
          make --version

      - name: Build transpiler and static library
        run: make all CC=gcc AR=ar

      - name: Check Windows console output
        run: |
          gcc -std=c11 -I include docs/exemplos/ola_mundo.c build/libbasicgol.a -lm -o build/probe
          ./build/probe > build/probe.out
          probe=$( {
            git config --show-origin --get core.autocrlf || true
            printf 'golden\n'
            od -An -tx1 tests/casos/02_basico/b01_ola/esperado.txt
            printf 'actual\n'
            od -An -tx1 build/probe.out
            printf 'comparison\n'
            T_TMP="$PWD/build"
            . tests/lib.sh
            difere tests/casos/02_basico/b01_ola/esperado.txt build/probe.out
            printf 'rc=%s\n' "$?"
            od -An -tx1 build/esperado.norm
            od -An -tx1 build/obtido.norm
          } | base64 -w 0)
          printf '::error::Windows output probe (base64): %s\n' "$probe"

      - name: Run language and library tests
        run: |
          if ! make test CC=gcc AR=ar > build/test.log 2>&1; then
            cat build/test.log
            tail -8 build/test.log | sed 's/^/::error::/'
            sed -n '/FALHA 02_basico\/b01_ola (M0)/,+6p' build/test.log | tr '\r' '?' | sed 's/^/::error::/'
            od -An -tx1 tests/casos/02_basico/b01_ola/esperado.txt | head -2 | sed 's/^/::error::/'
            grep -A1 'FALHA' build/test.log | head -30 | sed 's/^/::error::/'
            exit 1
          fi
          cat build/test.log

      - name: Build examples
        run: make exemplos CC=gcc AR=ar

      - name: Package Windows build
        run: |
          package="dist/basicgol-${{ matrix.artifact }}"
          mkdir -p "$package"
          cp -R include "$package/"
          cp build/libbasicgol.a LICENSE README.md "$package/"
          if [ -f build/basicgolc.exe ]; then
            cp build/basicgolc.exe "$package/"
          else
            cp build/basicgolc "$package/basicgolc.exe"
          fi
          "$package/basicgolc.exe" --versao

      - name: Upload Windows build
        uses: actions/upload-artifact@v7
        with:
          name: basicgol-${{ matrix.artifact }}
          path: dist/basicgol-${{ matrix.artifact }}/
          if-no-files-found: error
          retention-days: 14
